services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
        NODE_VERSION: "22"
    container_name: my-company-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env.docker
    environment:
      APP_NAME: ${APP_NAME:-My Company}
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: ${APP_LOCALE:-pt_BR}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-my_company}
      DB_USERNAME: ${DB_USERNAME:-mycompany}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@my-company.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-My Company}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      RUN_SEEDERS: ${RUN_SEEDERS:-true}
      APP_PORT: ${APP_PORT:-8080}
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_node_modules:/var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - my-company

  mysql:
    image: mysql:8.4
    container_name: my-company-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-my_company}
      MYSQL_USER: ${DB_USERNAME:-mycompany}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - my-company

  mailpit:
    image: axllent/mailpit:latest
    container_name: my-company-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - my-company

networks:
  my-company:
    driver: bridge

volumes:
  mysql_data:
  app_vendor:
  app_node_modules:
